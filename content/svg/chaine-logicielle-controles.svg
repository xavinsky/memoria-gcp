<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 296" role="img" aria-label="Contrôles de sécurité le long de la chaîne logicielle : source, dépendances, build, registre, déploiement, exécution, avec les secrets et les identités en transverse">
  <!-- Liaisons entre étapes -->
  <path class="flow-line" d="M142 40 H159 M291 40 H308 M440 40 H457 M589 40 H606 M738 40 H755"/>
  <!-- Liaisons étape → contrôles -->
  <path class="flow-line" d="M76 64 V94 M225 64 V94 M374 64 V94 M523 64 V94 M672 64 V94 M821 64 V94"/>

  <!-- Flèches -->
  <polygon class="flow-arrow" points="153,36 153,44 159,40"/>
  <polygon class="flow-arrow" points="302,36 302,44 308,40"/>
  <polygon class="flow-arrow" points="451,36 451,44 457,40"/>
  <polygon class="flow-arrow" points="600,36 600,44 606,40"/>
  <polygon class="flow-arrow" points="749,36 749,44 755,40"/>
  <polygon class="flow-arrow" points="72,94 80,94 76,100"/>
  <polygon class="flow-arrow" points="221,94 229,94 225,100"/>
  <polygon class="flow-arrow" points="370,94 378,94 374,100"/>
  <polygon class="flow-arrow" points="519,94 527,94 523,100"/>
  <polygon class="flow-arrow" points="668,94 676,94 672,100"/>
  <polygon class="flow-arrow" points="817,94 825,94 821,100"/>

  <!-- Étapes -->
  <rect class="flow-box q" x="10" y="16" width="132" height="48"/>
  <text class="flow-label q-label" x="76" y="37" text-anchor="middle">Source</text>
