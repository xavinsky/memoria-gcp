  <rect class="flow-box q" x="308" y="16" width="132" height="48"/>
  <text class="flow-label q-label" x="374" y="37" text-anchor="middle">Build</text>
  <text class="edge-text" x="374" y="54">Cloud Build</text>

  <rect class="flow-box q" x="457" y="16" width="132" height="48"/>
  <text class="flow-label q-label" x="523" y="37" text-anchor="middle">Registre</text>
  <text class="edge-text" x="523" y="54">Artifact Registry</text>

  <rect class="flow-box q" x="606" y="16" width="132" height="48"/>
  <text class="flow-label q-label" x="672" y="37" text-anchor="middle">Déploiement</text>
