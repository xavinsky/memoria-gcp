  <!-- Transverse -->
  <rect class="flow-box leaf" x="10" y="240" width="877" height="44"/>
  <text class="flow-label leaf-label" x="448" y="267" text-anchor="middle">Transverse : Secret Manager, Workload Identity Federation, IAM au moindre privilège</text>
</svg>
