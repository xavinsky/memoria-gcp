  <text class="edge-text" x="374" y="172">availableSecrets</text>
  <text class="edge-text" x="374" y="196">provenance SLSA 3</text>

  <rect class="flow-box" x="457" y="100" width="132" height="120"/>
  <text class="edge-text" x="523" y="124">analyse continue</text>
