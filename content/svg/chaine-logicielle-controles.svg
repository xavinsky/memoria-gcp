  <text class="edge-text" x="821" y="54">Cloud Run, GKE</text>

  <!-- Contrôles -->
  <rect class="flow-box" x="10" y="100" width="132" height="120"/>
  <text class="edge-text" x="76" y="124">branches protégées</text>
  <text class="edge-text" x="76" y="148">revue obligatoire</text>
  <text class="edge-text" x="76" y="172">commentaire /gcbrun</text>
  <text class="edge-text" x="76" y="196">compte robot</text>

  <rect class="flow-box" x="159" y="100" width="132" height="120"/>
  <text class="edge-text" x="225" y="124">dépôt distant</text>
  <text class="edge-text" x="225" y="148">dépôt virtuel</text>
  <text class="edge-text" x="225" y="172">Assured OSS</text>
