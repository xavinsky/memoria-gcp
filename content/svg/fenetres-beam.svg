<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-label="Types de fenêtres Apache Beam sur un même flux d'événements : fixes, glissantes, par session, globale">
  <!-- Libellés des lignes -->
  <text class="flow-label" x="10" y="40">Événements</text>
  <text class="flow-label" x="10" y="74">Fixe (tumbling)</text>
  <text class="flow-label" x="10" y="113">Glissante (hopping)</text>
  <text class="edge-text" x="70" y="130">taille 2, pas 1 min</text>
  <text class="flow-label" x="10" y="164">Session</text>
  <text class="edge-text" x="55" y="180">écart de 1 min</text>
  <text class="flow-label" x="10" y="214">Globale</text>

  <!-- Événements : 0,3 0,8 1,1 1,9 2,2 3,6 3,8 4,1 5,5 min -->
  <path class="flow-line" d="M190 36 H790"/>
  <circle class="flow-arrow" cx="220" cy="36" r="5"/>
  <circle class="flow-arrow" cx="270" cy="36" r="5"/>
  <circle class="flow-arrow" cx="300" cy="36" r="5"/>
  <circle class="flow-arrow" cx="380" cy="36" r="5"/>
  <circle class="flow-arrow" cx="410" cy="36" r="5"/>
  <circle class="flow-arrow" cx="550" cy="36" r="5"/>
  <circle class="flow-arrow" cx="570" cy="36" r="5"/>
  <circle class="flow-arrow" cx="600" cy="36" r="5"/>
  <circle class="flow-arrow" cx="740" cy="36" r="5"/>

  <!-- Fixe : [0,2) [2,4) [4,6) -->
  <rect class="flow-box q" x="190" y="56" width="198" height="26"/>
  <text class="edge-text" x="289" y="73">4 événements</text>
  <rect class="flow-box q" x="392" y="56" width="196" height="26"/>
  <text class="edge-text" x="490" y="73">3 événements</text>
  <rect class="flow-box q" x="592" y="56" width="196" height="26"/>
  <text class="edge-text" x="690" y="73">2 événements</text>

  <!-- Glissante : [0,2) [2,4) [4,6) puis [1,3) [3,5) [5,7) -->
  <rect class="flow-box q" x="190" y="98" width="198" height="16"/>
  <rect class="flow-box q" x="392" y="98" width="196" height="16"/>
  <rect class="flow-box q" x="592" y="98" width="196" height="16"/>
  <rect class="flow-box q" x="292" y="118" width="196" height="16"/>
  <rect class="flow-box q" x="492" y="118" width="196" height="16"/>
  <rect class="flow-box q" x="692" y="118" width="98" height="16"/>

  <!-- Session : [0,3 ; 3,2) [3,6 ; 5,1) [5,5 ; 6,5) -->
  <rect class="flow-box q" x="220" y="152" width="290" height="26"/>
  <text class="edge-text" x="365" y="169">session 1</text>
  <rect class="flow-box q" x="550" y="152" width="150" height="26"/>
  <text class="edge-text" x="625" y="169">session 2</text>
  <rect class="flow-box q" x="740" y="152" width="50" height="26"/>
  <text class="edge-text" x="765" y="169">…</text>

  <!-- Globale -->
  <rect class="flow-box" x="190" y="196" width="598" height="26"/>
  <text class="edge-text" x="489" y="213">une seule fenêtre : un déclencheur décide quand émettre</text>

  <!-- Axe du temps (heure de l'événement) -->
  <path class="flow-line" d="M190 244 H790 M190 240 V248 M290 240 V248 M390 240 V248 M490 240 V248 M590 240 V248 M690 240 V248 M790 240 V248"/>
  <text class="edge-text" x="190" y="262">0</text>
  <text class="edge-text" x="290" y="262">1</text>
  <text class="edge-text" x="390" y="262">2</text>
  <text class="edge-text" x="490" y="262">3</text>
  <text class="edge-text" x="590" y="262">4</text>
  <text class="edge-text" x="690" y="262">5</text>
  <text class="edge-text" x="775" y="262">6 min</text>
</svg>
