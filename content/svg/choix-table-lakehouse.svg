<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" role="img" aria-label="Arbre de décision pour choisir le type de table d'un lakehouse">
  <!-- Niveau 1 : qui écrit -->
  <rect class="flow-box q" x="300" y="22" width="200" height="36"/>
  <text class="flow-label q-label" x="400" y="45" text-anchor="middle">Qui écrit les tables ?</text>
  <path class="flow-line" d="M400 58 V95 M134 95 H596 M134 95 V156 M332 95 V276 M596 95 V156"/>
  <rect class="edge-chip" x="86" y="116" width="96" height="18"/>
  <text class="edge-text" x="134" y="129">BigQuery seul</text>
  <rect class="edge-chip" x="282" y="116" width="100" height="18"/>
  <text class="edge-text" x="332" y="129">Spark, Flink…</text>
  <rect class="edge-chip" x="540" y="116" width="112" height="18"/>
  <text class="edge-text" x="596" y="129">données en place</text>
  <polygon class="flow-arrow" points="130,156 138,156 134,162"/>
  <polygon class="flow-arrow" points="592,156 600,156 596,162"/>

  <!-- Niveau 2 : BigQuery seul -->
  <rect class="flow-box q" x="39" y="162" width="190" height="36"/>
  <text class="flow-label q-label" x="134" y="185" text-anchor="middle">Format ouvert requis ?</text>
  <path class="flow-line" d="M134 198 V225 M68 225 H200 M68 225 V276 M200 225 V276"/>
  <rect class="edge-chip" x="50" y="244" width="36" height="18"/>
  <text class="edge-text" x="68" y="257">non</text>
  <rect class="edge-chip" x="182" y="244" width="36" height="18"/>
  <text class="edge-text" x="200" y="257">oui</text>

  <!-- Niveau 2 : données déjà en place -->
  <rect class="flow-box q" x="491" y="162" width="210" height="36"/>
  <text class="flow-label q-label" x="596" y="185" text-anchor="middle">Où sont les métadonnées ?</text>
  <path class="flow-line" d="M596 198 V225 M464 225 H728 M464 225 V276 M596 225 V276 M728 225 V276"/>
  <rect class="edge-chip" x="416" y="244" width="96" height="18"/>
  <text class="edge-text" x="464" y="257">metastore Hive</text>
  <rect class="edge-chip" x="548" y="244" width="96" height="18"/>
  <text class="edge-text" x="596" y="257">fichiers seuls</text>
  <rect class="edge-chip" x="680" y="244" width="96" height="18"/>
  <text class="edge-text" x="728" y="257">Glue, Unity…</text>

  <!-- Feuilles -->
  <g>
    <polygon class="flow-arrow" points="64,276 72,276 68,282"/>
    <polygon class="flow-arrow" points="196,276 204,276 200,282"/>
    <polygon class="flow-arrow" points="328,276 336,276 332,282"/>
    <polygon class="flow-arrow" points="460,276 468,276 464,282"/>
    <polygon class="flow-arrow" points="592,276 600,276 596,282"/>
    <polygon class="flow-arrow" points="724,276 732,276 728,282"/>
  </g>
  <rect class="flow-box leaf" x="8" y="282" width="120" height="40"/>
  <text class="flow-label leaf-label" x="68" y="307" text-anchor="middle">Table native</text>
  <rect class="flow-box leaf" x="140" y="282" width="120" height="40"/>
  <text class="flow-label leaf-label" x="200" y="307" text-anchor="middle">Iceberg gérée</text>
  <rect class="flow-box leaf" x="272" y="282" width="120" height="40"/>
  <text class="flow-label leaf-label" x="332" y="307" text-anchor="middle">Iceberg REST</text>
  <rect class="flow-box leaf" x="404" y="282" width="120" height="40"/>
  <text class="flow-label leaf-label" x="464" y="307" text-anchor="middle">Point Hive</text>
  <rect class="flow-box leaf" x="536" y="282" width="120" height="40"/>
  <text class="flow-label leaf-label" x="596" y="307" text-anchor="middle">Table BigLake</text>
  <rect class="flow-box leaf" x="668" y="282" width="120" height="40"/>
  <text class="flow-label leaf-label" x="728" y="307" text-anchor="middle">Multicloud</text>
</svg>
