<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 334" role="img" aria-label="Arbre de décision pour choisir où faire la récupération d'une application RAG sur Google Cloud">
  <!-- Niveau 1 : nature des connaissances -->
  <rect class="flow-box q" x="330" y="22" width="240" height="36"/>
  <text class="flow-label q-label" x="450" y="45" text-anchor="middle">Où sont les connaissances ?</text>
  <path class="flow-line" d="M450 58 V95 M80 95 H820 M80 95 V276 M302 95 V156 M598 95 V156 M820 95 V276"/>
  <rect class="edge-chip" x="36" y="116" width="88" height="18"/>
  <text class="edge-text" x="80" y="129">web public</text>
  <rect class="edge-chip" x="234" y="116" width="136" height="18"/>
  <text class="edge-text" x="302" y="129">documents, sites</text>
  <rect class="edge-chip" x="530" y="116" width="136" height="18"/>
  <text class="edge-text" x="598" y="129">tables en base</text>
  <rect class="edge-chip" x="752" y="116" width="136" height="18"/>
  <text class="edge-text" x="820" y="129">index sur mesure</text>
  <polygon class="flow-arrow" points="298,156 306,156 302,162"/>
  <polygon class="flow-arrow" points="594,156 602,156 598,162"/>

  <!-- Niveau 2 : documents -->
  <rect class="flow-box q" x="207" y="162" width="190" height="36"/>
  <text class="flow-label q-label" x="302" y="185" text-anchor="middle">Chaîne à régler ?</text>
  <path class="flow-line" d="M302 198 V225 M228 225 H376 M228 225 V276 M376 225 V276"/>
  <rect class="edge-chip" x="178" y="244" width="100" height="18"/>
  <text class="edge-text" x="228" y="257">clé en main</text>
  <rect class="edge-chip" x="318" y="244" width="116" height="18"/>
  <text class="edge-text" x="376" y="257">découpage, modèle</text>

  <!-- Niveau 2 : tables -->
  <rect class="flow-box q" x="503" y="162" width="190" height="36"/>
  <text class="flow-label q-label" x="598" y="185" text-anchor="middle">Quelle base ?</text>
  <path class="flow-line" d="M598 198 V225 M524 225 H672 M524 225 V276 M672 225 V276"/>
  <rect class="edge-chip" x="480" y="244" width="88" height="18"/>
  <text class="edge-text" x="524" y="257">entrepôt</text>
  <rect class="edge-chip" x="614" y="244" width="116" height="18"/>
  <text class="edge-text" x="672" y="257">transactionnelle</text>

  <!-- Feuilles -->
  <g>
    <polygon class="flow-arrow" points="76,276 84,276 80,282"/>
    <polygon class="flow-arrow" points="224,276 232,276 228,282"/>
    <polygon class="flow-arrow" points="372,276 380,276 376,282"/>
    <polygon class="flow-arrow" points="520,276 528,276 524,282"/>
    <polygon class="flow-arrow" points="668,276 676,276 672,282"/>
    <polygon class="flow-arrow" points="816,276 824,276 820,282"/>
  </g>
  <rect class="flow-box leaf" x="12" y="282" width="136" height="40"/>
  <text class="flow-label leaf-label" x="80" y="307" text-anchor="middle">Google Search</text>
  <rect class="flow-box leaf" x="160" y="282" width="136" height="40"/>
  <text class="flow-label leaf-label" x="228" y="307" text-anchor="middle">Agent Search</text>
  <rect class="flow-box leaf" x="308" y="282" width="136" height="40"/>
  <text class="flow-label leaf-label" x="376" y="307" text-anchor="middle">RAG Engine</text>
  <rect class="flow-box leaf" x="456" y="282" width="136" height="40"/>
  <text class="flow-label leaf-label" x="524" y="307" text-anchor="middle">BigQuery</text>
  <rect class="flow-box leaf" x="604" y="282" width="136" height="40"/>
  <text class="flow-label leaf-label" x="672" y="307" text-anchor="middle">AlloyDB, Spanner</text>
  <rect class="flow-box leaf" x="752" y="282" width="136" height="40"/>
  <text class="flow-label leaf-label" x="820" y="307" text-anchor="middle">Agent Retrieval</text>
</svg>
