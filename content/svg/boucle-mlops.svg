  <text class="flow-label" x="110" y="170" text-anchor="middle">Préparer</text>
  <rect class="flow-box" x="225" y="145" width="140" height="40"/>
  <text class="flow-label" x="295" y="170" text-anchor="middle">Entraîner</text>
