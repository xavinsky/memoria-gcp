<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" role="img" aria-label="Boucle MLOps : dépôt Git, intégration continue, Artifact Registry, pipeline d'entraînement, Model Registry, endpoint, surveillance qui relance le pipeline">
