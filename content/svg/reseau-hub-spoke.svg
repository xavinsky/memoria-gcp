<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" role="img" aria-label="Réseau en étoile : le réseau d'entreprise rejoint un VPC de connectivité par Interconnect ou HA VPN, un hub Network Connectivity Center échange les routes avec les réseaux prod, hors prod et dev, chacun avec sa sortie Cloud NAT et son endpoint Private Service Connect vers les API Google">
  <!-- Zone : VPC de connectivité -->
  <rect class="flow-line" x="170" y="20" width="230" height="270"/>
  <text class="edge-text" x="285" y="42">VPC de connectivité</text>

  <!-- Liaisons -->
  <path class="flow-line" d="M150 88 H185"/>
  <path class="flow-line" d="M80 116 V238 H185"/>
  <path class="flow-line" d="M385 88 H490 V130"/>
  <path class="flow-line" d="M550 158 H575 M575 68 V248 M575 68 H600 M575 158 H600 M575 248 H600"/>
  <path class="flow-line" d="M646 276 V310 M744 276 V310"/>

  <!-- Pastilles -->
  <rect class="edge-chip" x="34" y="166" width="92" height="18"/>
  <text class="edge-text" x="80" y="179">transfert DNS</text>
  <rect class="edge-chip" x="391" y="79" width="92" height="18"/>
  <text class="edge-text" x="437" y="92">spoke hybride</text>

  <!-- Flèches -->
  <polygon class="flow-arrow" points="179,84 179,92 185,88"/>
  <polygon class="flow-arrow" points="179,234 179,242 185,238"/>
  <polygon class="flow-arrow" points="486,124 494,124 490,130"/>
  <polygon class="flow-arrow" points="594,64 594,72 600,68"/>
  <polygon class="flow-arrow" points="594,154 594,162 600,158"/>
  <polygon class="flow-arrow" points="594,244 594,252 600,248"/>
  <polygon class="flow-arrow" points="642,304 650,304 646,310"/>
  <polygon class="flow-arrow" points="740,304 748,304 744,310"/>

  <!-- Site -->
  <rect class="flow-box" x="10" y="60" width="140" height="56"/>
  <text class="flow-label" x="80" y="84" text-anchor="middle">Réseau d'entreprise</text>
  <text class="edge-text" x="80" y="102">DNS, routeurs BGP</text>

  <!-- VPC de connectivité -->
  <rect class="flow-box" x="185" y="60" width="200" height="56"/>
  <text class="flow-label" x="285" y="84" text-anchor="middle">Interconnect, HA VPN</text>
  <text class="edge-text" x="285" y="102">Cloud Router, BGP</text>
  <rect class="flow-box" x="185" y="210" width="200" height="56"/>
  <text class="flow-label" x="285" y="234" text-anchor="middle">Cloud DNS</text>
  <text class="edge-text" x="285" y="252">transfert, règle entrante</text>

  <!-- Hub -->
  <rect class="flow-box q" x="430" y="130" width="120" height="56"/>
  <text class="flow-label q-label" x="490" y="154" text-anchor="middle">Hub NCC</text>
  <text class="edge-text" x="490" y="172">échange de routes</text>

  <!-- Spokes -->
  <rect class="flow-box leaf" x="600" y="40" width="190" height="56"/>
  <text class="flow-label leaf-label" x="695" y="64" text-anchor="middle">VPC prod</text>
  <text class="edge-text" x="695" y="82">Shared VPC, spoke VPC</text>
  <rect class="flow-box leaf" x="600" y="130" width="190" height="56"/>
  <text class="flow-label leaf-label" x="695" y="154" text-anchor="middle">VPC hors prod</text>
  <text class="edge-text" x="695" y="172">Shared VPC, spoke VPC</text>
  <rect class="flow-box leaf" x="600" y="220" width="190" height="56"/>
  <text class="flow-label leaf-label" x="695" y="244" text-anchor="middle">VPC dev</text>
  <text class="edge-text" x="695" y="262">Shared VPC, spoke VPC</text>

  <!-- Sorties de chaque réseau -->
  <rect class="flow-box" x="600" y="310" width="92" height="48"/>
  <text class="flow-label" x="646" y="330" text-anchor="middle">Internet</text>
  <text class="edge-text" x="646" y="347">Cloud NAT</text>
  <rect class="flow-box" x="698" y="310" width="92" height="48"/>
  <text class="flow-label" x="744" y="330" text-anchor="middle">API Google</text>
  <text class="edge-text" x="744" y="347">endpoint PSC</text>
</svg>
