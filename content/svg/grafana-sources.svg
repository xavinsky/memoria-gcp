<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-label="Grafana branché sur Google Cloud : quatre sources de données (Cloud Monitoring, Managed Service for Prometheus, Cloud Logging, BigQuery), un compte de service sans clé et le data source syncer qui renouvelle le jeton de la source Prometheus">
  <!-- Liaisons -->
  <path class="flow-line" d="M140 142 H200"/>
  <path class="flow-line" d="M280 58 V110"/>
  <path class="flow-line" d="M280 230 V174"/>
  <path class="flow-line" d="M360 142 H400 M400 44 V254 M400 44 H560 M400 114 H560 M400 184 H560 M400 254 H560"/>

  <!-- Pastilles -->
  <rect class="edge-chip" x="237" y="75" width="86" height="18"/>
  <text class="edge-text" x="280" y="88">API Grafana</text>
  <rect class="edge-chip" x="237" y="193" width="86" height="18"/>
  <text class="edge-text" x="280" y="206">ADC</text>
  <rect class="edge-chip" x="427" y="35" width="100" height="18"/>
  <text class="edge-text" x="477" y="48">stackdriver</text>
  <rect class="edge-chip" x="427" y="105" width="100" height="18"/>
  <text class="edge-text" x="477" y="118">prometheus</text>
  <rect class="edge-chip" x="412" y="175" width="130" height="18"/>
  <text class="edge-text" x="477" y="188">googlecloud-logging</text>
  <rect class="edge-chip" x="417" y="245" width="120" height="18"/>
  <text class="edge-text" x="477" y="258">grafana-bigquery</text>

  <!-- Flèches -->
  <polygon class="flow-arrow" points="194,138 194,146 200,142"/>
  <polygon class="flow-arrow" points="276,104 284,104 280,110"/>
  <polygon class="flow-arrow" points="276,180 284,180 280,174"/>
  <polygon class="flow-arrow" points="554,40 554,48 560,44"/>
  <polygon class="flow-arrow" points="554,110 554,118 560,114"/>
  <polygon class="flow-arrow" points="554,180 554,188 560,184"/>
  <polygon class="flow-arrow" points="554,250 554,258 560,254"/>

  <!-- Nœuds -->
  <rect class="flow-box" x="10" y="118" width="130" height="48"/>
  <text class="flow-label" x="75" y="139" text-anchor="middle">Utilisateurs</text>
  <text class="edge-text" x="75" y="156">tableaux, alertes</text>

  <rect class="flow-box" x="200" y="10" width="160" height="48"/>
  <text class="flow-label" x="280" y="31" text-anchor="middle">Data source syncer</text>
  <text class="edge-text" x="280" y="48">jeton toutes les 10 min</text>

  <rect class="flow-box q" x="200" y="110" width="160" height="64"/>
  <text class="flow-label q-label" x="280" y="137" text-anchor="middle">Grafana</text>
  <text class="edge-text" x="280" y="155">GKE, Cloud Run, Cloud</text>

  <rect class="flow-box" x="200" y="230" width="160" height="48"/>
  <text class="flow-label" x="280" y="251" text-anchor="middle">Compte de service</text>
  <text class="edge-text" x="280" y="268">rôles de lecture</text>

  <rect class="flow-box leaf" x="560" y="20" width="230" height="48"/>
  <text class="flow-label leaf-label" x="675" y="41" text-anchor="middle">Cloud Monitoring</text>
  <text class="edge-text" x="675" y="58">métriques GCP, SLO, PromQL</text>

  <rect class="flow-box leaf" x="560" y="90" width="230" height="48"/>
  <text class="flow-label leaf-label" x="675" y="111" text-anchor="middle">Managed Prometheus</text>
  <text class="edge-text" x="675" y="128">API Prometheus, PromQL</text>

  <rect class="flow-box leaf" x="560" y="160" width="230" height="48"/>
  <text class="flow-label leaf-label" x="675" y="181" text-anchor="middle">Cloud Logging</text>
  <text class="edge-text" x="675" y="198">journaux, langage Logging</text>

  <rect class="flow-box leaf" x="560" y="230" width="230" height="48"/>
  <text class="flow-label leaf-label" x="675" y="251" text-anchor="middle">BigQuery</text>
  <text class="edge-text" x="675" y="268">tables, SQL</text>
</svg>
