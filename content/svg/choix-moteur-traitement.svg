<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" role="img" aria-label="Arbre de décision pour choisir un moteur de traitement de données">
  <!-- Niveau 1 : point de départ -->
  <rect class="flow-box q" x="300" y="22" width="200" height="36"/>
  <text class="flow-label q-label" x="400" y="45" text-anchor="middle">Point de départ ?</text>
  <path class="flow-line" d="M400 58 V95 M70 95 H655 M70 95 V276 M265 95 V156 M460 95 V276 M655 95 V156"/>
  <rect class="edge-chip" x="23" y="116" width="94" height="18"/>
  <text class="edge-text" x="70" y="129">Spark existant</text>
  <rect class="edge-chip" x="208" y="116" width="114" height="18"/>
  <text class="edge-text" x="265" y="129">SQL dans BigQuery</text>
  <rect class="edge-chip" x="400" y="116" width="120" height="18"/>
  <text class="edge-text" x="460" y="129">code neuf, flux</text>
  <rect class="edge-chip" x="595" y="116" width="120" height="18"/>
  <text class="edge-text" x="655" y="129">sans code</text>
  <polygon class="flow-arrow" points="261,156 269,156 265,162"/>
  <polygon class="flow-arrow" points="651,156 659,156 655,162"/>

  <!-- Niveau 2 : SQL dans BigQuery -->
  <rect class="flow-box q" x="175" y="162" width="180" height="36"/>
  <text class="flow-label q-label" x="265" y="185" text-anchor="middle">Combien d'étapes ?</text>
  <path class="flow-line" d="M265 198 V225 M200 225 H330 M200 225 V276 M330 225 V276"/>
  <rect class="edge-chip" x="150" y="244" width="100" height="18"/>
  <text class="edge-text" x="200" y="257">quelques-unes</text>
  <rect class="edge-chip" x="278" y="244" width="104" height="18"/>
  <text class="edge-text" x="330" y="257">graphe, tests</text>

  <!-- Niveau 2 : sans code -->
  <rect class="flow-box q" x="565" y="162" width="180" height="36"/>
  <text class="flow-label q-label" x="655" y="185" text-anchor="middle">Données sources ?</text>
  <path class="flow-line" d="M655 198 V225 M590 225 H720 M590 225 V276 M720 225 V276"/>
  <rect class="edge-chip" x="538" y="244" width="104" height="18"/>
  <text class="edge-text" x="590" y="257">SAP, SaaS, SGBD</text>
  <rect class="edge-chip" x="668" y="244" width="104" height="18"/>
  <text class="edge-text" x="720" y="257">déjà dans BQ</text>

  <!-- Feuilles -->
  <g>
    <polygon class="flow-arrow" points="66,276 74,276 70,282"/>
    <polygon class="flow-arrow" points="196,276 204,276 200,282"/>
    <polygon class="flow-arrow" points="326,276 334,276 330,282"/>
    <polygon class="flow-arrow" points="456,276 464,276 460,282"/>
    <polygon class="flow-arrow" points="586,276 594,276 590,282"/>
    <polygon class="flow-arrow" points="716,276 724,276 720,282"/>
  </g>
  <rect class="flow-box leaf" x="8" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="70" y="307" text-anchor="middle">Spark géré</text>
  <rect class="flow-box leaf" x="138" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="200" y="307" text-anchor="middle">BigQuery SQL</text>
  <rect class="flow-box leaf" x="268" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="330" y="307" text-anchor="middle">Dataform</text>
  <rect class="flow-box leaf" x="398" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="460" y="307" text-anchor="middle">Dataflow</text>
  <rect class="flow-box leaf" x="528" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="590" y="307" text-anchor="middle">Data Fusion</text>
  <rect class="flow-box leaf" x="658" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="720" y="307" text-anchor="middle">Préparation BQ</text>
</svg>
