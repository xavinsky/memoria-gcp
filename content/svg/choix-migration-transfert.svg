<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 398" role="img" aria-label="Arbre de décision pour choisir un service de migration ou de transfert de données">
  <!-- Niveau 1 : nature des données -->
  <rect class="flow-box q" x="386" y="16" width="220" height="36"/>
  <text class="flow-label q-label" x="496" y="39" text-anchor="middle">Quelles données déplacer ?</text>
  <path class="flow-line" d="M496 52 V86 M216 86 H916 M216 86 V124 M496 86 V334 M706 86 V124 M916 86 V334"/>
  <rect class="edge-chip" x="160" y="100" width="112" height="18"/>
  <text class="edge-text" x="216" y="113">Fichiers, objets</text>
  <rect class="edge-chip" x="462" y="100" width="68" height="18"/>
  <text class="edge-text" x="496" y="113">Entrepôt</text>
  <rect class="edge-chip" x="632" y="100" width="148" height="18"/>
  <text class="edge-text" x="706" y="113">Base transactionnelle</text>
  <rect class="edge-chip" x="851" y="100" width="130" height="18"/>
  <text class="edge-text" x="916" y="113">SaaS vers BigQuery</text>
  <polygon class="flow-arrow" points="212,124 220,124 216,130"/>
  <polygon class="flow-arrow" points="702,124 710,124 706,130"/>

  <!-- Niveau 2 : fichiers, bande passante -->
  <rect class="flow-box q" x="94" y="130" width="244" height="36"/>
  <text class="flow-label q-label" x="216" y="153" text-anchor="middle">Réseau : moins d'une semaine ?</text>
  <path class="flow-line" d="M216 166 V190 M76 190 H286 M76 190 V334 M286 190 V234"/>
  <rect class="edge-chip" x="56" y="204" width="40" height="18"/>
  <text class="edge-text" x="76" y="217">non</text>
  <rect class="edge-chip" x="266" y="204" width="40" height="18"/>
  <text class="edge-text" x="286" y="217">oui</text>
  <polygon class="flow-arrow" points="282,234 290,234 286,240"/>

  <!-- Niveau 3 : fichiers, volume et fréquence -->
  <rect class="flow-box q" x="191" y="240" width="190" height="36"/>
  <text class="flow-label q-label" x="286" y="263" text-anchor="middle">Volume et fréquence ?</text>
  <path class="flow-line" d="M286 276 V296 M216 296 H356 M216 296 V334 M356 296 V334"/>
  <rect class="edge-chip" x="158" y="305" width="116" height="18"/>
  <text class="edge-text" x="216" y="318">&lt; 1 To, ponctuel</text>
  <rect class="edge-chip" x="290" y="305" width="132" height="18"/>
  <text class="edge-text" x="356" y="318">&gt; 1 To ou récurrent</text>

  <!-- Niveau 2 : base transactionnelle, destination -->
  <rect class="flow-box q" x="631" y="130" width="150" height="36"/>
  <text class="flow-label q-label" x="706" y="153" text-anchor="middle">Destination ?</text>
  <path class="flow-line" d="M706 166 V190 M636 190 H776 M636 190 V334 M776 190 V334"/>
  <rect class="edge-chip" x="573" y="204" width="126" height="18"/>
  <text class="edge-text" x="636" y="217">Cloud SQL, AlloyDB</text>
  <rect class="edge-chip" x="716" y="204" width="120" height="18"/>
  <text class="edge-text" x="776" y="217">BigQuery, continu</text>

  <!-- Feuilles -->
  <g>
    <polygon class="flow-arrow" points="72,334 80,334 76,340"/>
    <polygon class="flow-arrow" points="212,334 220,334 216,340"/>
    <polygon class="flow-arrow" points="352,334 360,334 356,340"/>
    <polygon class="flow-arrow" points="492,334 500,334 496,340"/>
    <polygon class="flow-arrow" points="632,334 640,334 636,340"/>
    <polygon class="flow-arrow" points="772,334 780,334 776,340"/>
    <polygon class="flow-arrow" points="912,334 920,334 916,340"/>
  </g>
  <rect class="flow-box leaf" x="8" y="340" width="136" height="46"/>
  <text class="flow-label leaf-label" x="76" y="359" text-anchor="middle">Transfer<tspan x="76" dy="17">Appliance</tspan></text>
  <rect class="flow-box leaf" x="148" y="340" width="136" height="46"/>
  <text class="flow-label leaf-label" x="216" y="368" text-anchor="middle">gcloud storage</text>
  <rect class="flow-box leaf" x="288" y="340" width="136" height="46"/>
  <text class="flow-label leaf-label" x="356" y="359" text-anchor="middle">Storage Transfer<tspan x="356" dy="17">Service</tspan></text>
  <rect class="flow-box leaf" x="428" y="340" width="136" height="46"/>
  <text class="flow-label leaf-label" x="496" y="359" text-anchor="middle">BigQuery<tspan x="496" dy="17">Migration Service</tspan></text>
  <rect class="flow-box leaf" x="568" y="340" width="136" height="46"/>
  <text class="flow-label leaf-label" x="636" y="359" text-anchor="middle">Database<tspan x="636" dy="17">Migration Service</tspan></text>
  <rect class="flow-box leaf" x="708" y="340" width="136" height="46"/>
  <text class="flow-label leaf-label" x="776" y="368" text-anchor="middle">Datastream</text>
  <rect class="flow-box leaf" x="848" y="340" width="136" height="46"/>
  <text class="flow-label leaf-label" x="916" y="359" text-anchor="middle">BigQuery Data<tspan x="916" dy="17">Transfer Service</tspan></text>
</svg>
