<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" role="img" aria-label="Pipeline Cloud Deploy à trois cibles : l'intégration continue crée une release, déployée en dev, promue automatiquement en staging, puis après approbation en prod par un canary à 25 %, 50 % puis stable, piloté par une automatisation">
  <!-- Rangée 1 : release -->
  <rect class="flow-box" x="10" y="20" width="180" height="50"/>
  <text class="flow-label" x="100" y="41" text-anchor="middle">Intégration continue</text>
  <text class="edge-text" x="100" y="59">image@sha256</text>
  <rect class="flow-box q" x="310" y="20" width="180" height="50"/>
  <text class="flow-label q-label" x="400" y="41" text-anchor="middle">Release</text>
  <text class="edge-text" x="400" y="59">manifestes rendus, figés</text>
  <path class="flow-line" d="M190 45 H304 M400 70 V95 H100 V114"/>
  <polygon class="flow-arrow" points="304,41 304,49 310,45"/>
  <polygon class="flow-arrow" points="96,114 104,114 100,120"/>
  <rect class="edge-chip" x="200" y="26" width="96" height="18"/>
  <text class="edge-text" x="248" y="39">releases create</text>
  <rect class="edge-chip" x="190" y="86" width="104" height="18"/>
  <text class="edge-text" x="242" y="99">premier rollout</text>

  <!-- Rangée 2 : cibles -->
  <rect class="flow-box" x="10" y="120" width="180" height="56"/>
  <text class="flow-label" x="100" y="144" text-anchor="middle">dev</text>
  <text class="edge-text" x="100" y="162">standard</text>
  <rect class="flow-box" x="310" y="120" width="180" height="56"/>
  <text class="flow-label" x="400" y="144" text-anchor="middle">staging</text>
  <text class="edge-text" x="400" y="162">standard, verify</text>
  <rect class="flow-box leaf" x="610" y="120" width="180" height="56"/>
  <text class="flow-label leaf-label" x="700" y="144" text-anchor="middle">prod</text>
  <text class="edge-text" x="700" y="162">requireApproval</text>
  <path class="flow-line" d="M190 148 H304 M490 148 H604"/>
  <polygon class="flow-arrow" points="304,144 304,152 310,148"/>
  <polygon class="flow-arrow" points="604,144 604,152 610,148"/>
  <rect class="edge-chip" x="200" y="152" width="96" height="18"/>
  <text class="edge-text" x="248" y="165">promotion auto</text>
  <rect class="edge-chip" x="505" y="152" width="84" height="18"/>
  <text class="edge-text" x="547" y="165">approbation</text>

  <!-- Rangée 3 : rollout canary en prod -->
  <path class="flow-line" d="M700 176 V214"/>
  <polygon class="flow-arrow" points="696,214 704,214 700,220"/>
  <rect class="flow-box q" x="210" y="220" width="580" height="82"/>
  <text class="flow-label q-label" x="500" y="238" text-anchor="middle">Rollout prod : canary</text>
  <rect class="flow-box" x="230" y="252" width="130" height="36"/>
  <text class="flow-label" x="295" y="275" text-anchor="middle">canary-25</text>
  <rect class="flow-box" x="430" y="252" width="130" height="36"/>
  <text class="flow-label" x="495" y="275" text-anchor="middle">canary-50</text>
  <rect class="flow-box leaf" x="630" y="252" width="130" height="36"/>
  <text class="flow-label leaf-label" x="695" y="275" text-anchor="middle">stable</text>
  <path class="flow-line" d="M360 270 H424 M560 270 H624"/>
  <polygon class="flow-arrow" points="424,266 424,274 430,270"/>
  <polygon class="flow-arrow" points="624,266 624,274 630,270"/>
  <rect class="edge-chip" x="372" y="249" width="46" height="16"/>
  <text class="edge-text" x="395" y="261">avance</text>
  <rect class="edge-chip" x="572" y="249" width="46" height="16"/>
  <text class="edge-text" x="595" y="261">avance</text>

  <rect class="flow-box" x="10" y="220" width="170" height="82"/>
  <text class="flow-label" x="95" y="242" text-anchor="middle">Automatisation</text>
  <text class="edge-text" x="95" y="262">promoteRelease</text>
  <text class="edge-text" x="95" y="277">advanceRollout</text>
  <text class="edge-text" x="95" y="292">repairRollout</text>
  <path class="flow-line" d="M180 261 H204"/>
  <polygon class="flow-arrow" points="204,257 204,265 210,261"/>
</svg>
