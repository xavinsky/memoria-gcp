<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" role="img" aria-label="Arbre de diagnostic d'une requête BigQuery, du symptôme à la cause probable">
  <!-- Niveau 1 : symptôme -->
  <rect class="flow-box q" x="300" y="22" width="200" height="36"/>
  <text class="flow-label q-label" x="400" y="45" text-anchor="middle">Symptôme ?</text>
  <path class="flow-line" d="M400 58 V95 M265 95 H720 M265 95 V156 M590 95 V276 M720 95 V276"/>
  <rect class="edge-chip" x="200" y="116" width="130" height="18"/>
  <text class="edge-text" x="265" y="129">s'exécute lentement</text>
  <rect class="edge-chip" x="535" y="116" width="110" height="18"/>
  <text class="edge-text" x="590" y="129">en file, DML</text>
  <rect class="edge-chip" x="660" y="116" width="120" height="18"/>
  <text class="edge-text" x="720" y="129">resources exceeded</text>
  <polygon class="flow-arrow" points="261,156 269,156 265,162"/>

  <!-- Niveau 2 : étape dominante -->
  <rect class="flow-box q" x="160" y="162" width="210" height="36"/>
  <text class="flow-label q-label" x="265" y="185" text-anchor="middle">Mesure dominante ?</text>
  <path class="flow-line" d="M265 198 V225 M70 225 H460 M70 225 V276 M200 225 V276 M330 225 V276 M460 225 V276"/>
  <rect class="edge-chip" x="25" y="244" width="90" height="18"/>
  <text class="edge-text" x="70" y="257">attente</text>
  <rect class="edge-chip" x="155" y="244" width="90" height="18"/>
  <text class="edge-text" x="200" y="257">lecture</text>
  <rect class="edge-chip" x="272" y="244" width="116" height="18"/>
  <text class="edge-text" x="330" y="257">max ≫ moyenne</text>
  <rect class="edge-chip" x="400" y="244" width="120" height="18"/>
  <text class="edge-text" x="460" y="257">sortie ≫ entrée</text>

  <!-- Feuilles -->
  <g>
    <polygon class="flow-arrow" points="66,276 74,276 70,282"/>
    <polygon class="flow-arrow" points="196,276 204,276 200,282"/>
    <polygon class="flow-arrow" points="326,276 334,276 330,282"/>
    <polygon class="flow-arrow" points="456,276 464,276 460,282"/>
    <polygon class="flow-arrow" points="586,276 594,276 590,282"/>
    <polygon class="flow-arrow" points="716,276 724,276 720,282"/>
  </g>
  <rect class="flow-box leaf" x="8" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="70" y="307" text-anchor="middle">Slots, concurrence</text>
  <rect class="flow-box leaf" x="138" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="200" y="307" text-anchor="middle">Élagage, colonnes</text>
  <rect class="flow-box leaf" x="268" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="330" y="307" text-anchor="middle">Déséquilibre</text>
  <rect class="flow-box leaf" x="398" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="460" y="307" text-anchor="middle">Jointure</text>
  <rect class="flow-box leaf" x="528" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="590" y="307" text-anchor="middle">File, verrous DML</text>
  <rect class="flow-box leaf" x="658" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="720" y="307" text-anchor="middle">Brassage, SQL</text>
</svg>
