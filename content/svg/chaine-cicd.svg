<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-label="Chaîne CI/CD de référence : dépôt Git, déclencheur, Cloud Build avec Secret Manager, Artifact Registry analysé par Artifact Analysis, puis Cloud Deploy qui promeut la même image de dev à staging puis prod, sous le contrôle de Binary Authorization, avec les journaux dans Cloud Logging">
  <!-- Rangée 1 : intégration continue -->
  <rect class="flow-box" x="10" y="20" width="120" height="54"/>
  <text class="flow-label" x="70" y="43" text-anchor="middle">Dépôt Git</text>
  <text class="edge-text" x="70" y="61">GitHub, GitLab</text>

  <rect class="flow-box" x="190" y="20" width="150" height="54"/>
  <text class="flow-label" x="265" y="43" text-anchor="middle">Déclencheur</text>
  <text class="edge-text" x="265" y="61">Developer Connect</text>

  <rect class="flow-box q" x="390" y="20" width="170" height="54"/>
  <text class="flow-label q-label" x="475" y="43" text-anchor="middle">Cloud Build</text>
  <text class="edge-text" x="475" y="61">tests, build, push</text>

  <rect class="flow-box" x="620" y="20" width="170" height="54"/>
  <text class="flow-label" x="705" y="43" text-anchor="middle">Artifact Registry</text>
  <text class="edge-text" x="705" y="61">image@sha256</text>

  <path class="flow-line" d="M130 47 H184 M340 47 H384 M560 47 H614"/>
  <polygon class="flow-arrow" points="184,43 184,51 190,47"/>
  <polygon class="flow-arrow" points="384,43 384,51 390,47"/>
  <polygon class="flow-arrow" points="614,43 614,51 620,47"/>
  <rect class="edge-chip" x="133" y="56" width="54" height="18"/>
  <text class="edge-text" x="160" y="69">push, PR</text>
  <rect class="edge-chip" x="570" y="56" width="40" height="18"/>
  <text class="edge-text" x="590" y="69">push</text>

  <!-- Rangée 2 : secrets et analyse -->
  <rect class="flow-box" x="190" y="120" width="150" height="46"/>
  <text class="flow-label" x="265" y="139" text-anchor="middle">Secret Manager</text>
  <text class="edge-text" x="265" y="156">jetons, mots de passe</text>

  <rect class="flow-box" x="620" y="120" width="170" height="46"/>
  <text class="flow-label" x="705" y="139" text-anchor="middle">Artifact Analysis</text>
  <text class="edge-text" x="705" y="156">vulnérabilités, SBOM</text>

  <path class="flow-line" d="M340 143 H420 V80 M705 74 V114"/>
  <polygon class="flow-arrow" points="416,80 424,80 420,74"/>
  <polygon class="flow-arrow" points="701,114 709,114 705,120"/>
  <rect class="edge-chip" x="366" y="89" width="108" height="18"/>
  <text class="edge-text" x="420" y="102">availableSecrets</text>
  <rect class="edge-chip" x="638" y="88" width="134" height="18"/>
  <text class="edge-text" x="705" y="101">analyse à la poussée</text>

  <!-- Rangée 3 : livraison continue -->
  <path class="flow-line" d="M530 74 V194"/>
  <polygon class="flow-arrow" points="526,194 534,194 530,200"/>
  <rect class="edge-chip" x="480" y="160" width="100" height="18"/>
  <text class="edge-text" x="530" y="173">crée la release</text>

  <rect class="flow-box q" x="10" y="200" width="780" height="96"/>
  <text class="flow-label q-label" x="400" y="220" text-anchor="middle">Cloud Deploy : une release, un rollout par cible</text>
  <rect class="flow-box" x="40" y="234" width="190" height="46"/>
  <text class="flow-label" x="135" y="253" text-anchor="middle">dev</text>
  <text class="edge-text" x="135" y="270">projet dev</text>
  <rect class="flow-box" x="305" y="234" width="190" height="46"/>
  <text class="flow-label" x="400" y="253" text-anchor="middle">staging</text>
  <text class="edge-text" x="400" y="270">projet staging</text>
  <rect class="flow-box leaf" x="570" y="234" width="190" height="46"/>
  <text class="flow-label leaf-label" x="665" y="253" text-anchor="middle">prod</text>
  <text class="edge-text" x="665" y="270">Cloud Run ou GKE</text>
  <path class="flow-line" d="M230 257 H299 M495 257 H564"/>
  <polygon class="flow-arrow" points="299,253 299,261 305,257"/>
  <polygon class="flow-arrow" points="564,253 564,261 570,257"/>
  <rect class="edge-chip" x="234" y="238" width="66" height="16"/>
  <text class="edge-text" x="267" y="250">promotion</text>
  <rect class="edge-chip" x="497" y="238" width="70" height="16"/>
  <text class="edge-text" x="532" y="250">approbation</text>

  <!-- Rangée 4 : contrôle et journaux -->
  <path class="flow-line" d="M210 296 V318 M590 296 V318"/>
  <rect class="flow-box" x="40" y="318" width="340" height="44"/>
  <text class="flow-label" x="210" y="336" text-anchor="middle">Binary Authorization</text>
  <text class="edge-text" x="210" y="353">admission : images attestées seulement</text>
  <rect class="flow-box" x="420" y="318" width="340" height="44"/>
  <text class="flow-label" x="590" y="336" text-anchor="middle">Cloud Logging</text>
  <text class="edge-text" x="590" y="353">journaux de build, de rollout, d'audit</text>
</svg>
