<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" role="img" aria-label="Arbre de décision : d'où viennent les identités des personnes qui accèdent à Google Cloud et à ses applications">
  <!-- Niveau 1 : qui se connecte -->
  <rect class="flow-box q" x="458" y="14" width="200" height="36"/>
  <text class="flow-label q-label" x="558" y="37" text-anchor="middle">Qui se connecte ?</text>
  <path class="flow-line" d="M558 50 V80 M400 80 H716 M400 80 V114 M716 80 V324"/>
  <rect class="edge-chip" x="350" y="89" width="100" height="18"/>
  <text class="edge-text" x="400" y="102">collaborateurs</text>
  <rect class="edge-chip" x="657" y="89" width="118" height="18"/>
  <text class="edge-text" x="716" y="102">clients d'une app</text>
  <polygon class="flow-arrow" points="396,114 404,114 400,120"/>

  <!-- Niveau 2 : comptes Google ou non -->
  <rect class="flow-box q" x="310" y="120" width="180" height="36"/>
  <text class="flow-label q-label" x="400" y="143" text-anchor="middle">Comptes Google ?</text>
  <path class="flow-line" d="M400 156 V180 M235 180 H557 M235 180 V216 M557 180 V324"/>
  <rect class="edge-chip" x="218" y="187" width="34" height="18"/>
  <text class="edge-text" x="235" y="200">oui</text>
  <rect class="edge-chip" x="540" y="187" width="34" height="18"/>
  <text class="edge-text" x="557" y="200">non</text>
  <polygon class="flow-arrow" points="231,216 239,216 235,222"/>

  <!-- Niveau 3 : source de vérité -->
  <rect class="flow-box q" x="145" y="222" width="180" height="36"/>
  <text class="flow-label q-label" x="235" y="245" text-anchor="middle">Annuaire existant ?</text>
  <path class="flow-line" d="M235 258 V280 M80 280 H390 M80 280 V324 M235 280 V324 M390 280 V324"/>
  <rect class="edge-chip" x="55" y="291" width="50" height="18"/>
  <text class="edge-text" x="80" y="304">aucun</text>
  <rect class="edge-chip" x="200" y="291" width="70" height="18"/>
  <text class="edge-text" x="235" y="304">AD, LDAP</text>
  <rect class="edge-chip" x="340" y="291" width="100" height="18"/>
  <text class="edge-text" x="390" y="304">Entra ID, Okta</text>

  <!-- Feuilles -->
  <g>
    <polygon class="flow-arrow" points="76,324 84,324 80,330"/>
    <polygon class="flow-arrow" points="231,324 239,324 235,330"/>
    <polygon class="flow-arrow" points="386,324 394,324 390,330"/>
    <polygon class="flow-arrow" points="553,324 561,324 557,330"/>
    <polygon class="flow-arrow" points="712,324 720,324 716,330"/>
  </g>
  <rect class="flow-box leaf" x="8" y="330" width="145" height="46"/>
  <text class="flow-label leaf-label" x="80" y="350" text-anchor="middle">Cloud Identity</text>
  <text class="edge-text" x="80" y="368">comptes natifs</text>
  <rect class="flow-box leaf" x="163" y="330" width="145" height="46"/>
  <text class="flow-label leaf-label" x="235" y="350" text-anchor="middle">GCDS + SSO</text>
  <text class="edge-text" x="235" y="368">synchro, SAML</text>
  <rect class="flow-box leaf" x="318" y="330" width="145" height="46"/>
  <text class="flow-label leaf-label" x="390" y="350" text-anchor="middle">Connecteur IdP</text>
  <text class="edge-text" x="390" y="368">provisionnement, SAML</text>
  <rect class="flow-box leaf" x="479" y="330" width="156" height="46"/>
  <text class="flow-label leaf-label" x="557" y="350" text-anchor="middle">Fédération</text>
  <text class="edge-text" x="557" y="368">pool de personnel</text>
  <rect class="flow-box leaf" x="641" y="330" width="150" height="46"/>
  <text class="flow-label leaf-label" x="716" y="350" text-anchor="middle">Identity Platform</text>
  <text class="edge-text" x="716" y="368">hors annuaire</text>
</svg>
