<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" role="img" aria-label="Pipeline de streaming de référence : Pub/Sub, Dataflow, puis BigQuery, Bigtable et une destination d'erreurs ; abonnement BigQuery en raccourci">
  <!-- Liaisons -->
  <path class="flow-line" d="M120 138 H165"/>
  <path class="flow-line" d="M230 110 V34 H620"/>
  <path class="flow-line" d="M295 138 H370"/>
  <path class="flow-line" d="M510 138 H620 M560 138 V62 H620 M560 138 V228 H620"/>

  <!-- Pastilles -->
  <rect class="edge-chip" x="300" y="25" width="250" height="18"/>
  <text class="edge-text" x="425" y="38">abonnement BigQuery, sans Dataflow</text>
  <rect class="edge-chip" x="312" y="129" width="40" height="18"/>
  <text class="edge-text" x="332" y="142">pull</text>
  <rect class="edge-chip" x="504" y="82" width="112" height="18"/>
  <text class="edge-text" x="560" y="95">Storage Write API</text>
  <rect class="edge-chip" x="526" y="176" width="68" height="18"/>
  <text class="edge-text" x="560" y="189">rejets</text>

  <!-- Flèches -->
  <polygon class="flow-arrow" points="159,134 159,142 165,138"/>
  <polygon class="flow-arrow" points="614,30 614,38 620,34"/>
  <polygon class="flow-arrow" points="364,134 364,142 370,138"/>
  <polygon class="flow-arrow" points="614,58 614,66 620,62"/>
  <polygon class="flow-arrow" points="614,134 614,142 620,138"/>
  <polygon class="flow-arrow" points="614,224 614,232 620,228"/>

  <!-- Nœuds -->
  <rect class="flow-box" x="10" y="110" width="110" height="56"/>
  <text class="flow-label" x="65" y="134" text-anchor="middle">Producteurs</text>
  <text class="edge-text" x="65" y="152">apps, IoT, CDC</text>

  <rect class="flow-box" x="165" y="110" width="130" height="56"/>
  <text class="flow-label" x="230" y="134" text-anchor="middle">Pub/Sub</text>
  <text class="edge-text" x="230" y="152">sujet, abonnement</text>

  <rect class="flow-box q" x="370" y="110" width="140" height="56"/>
  <text class="flow-label q-label" x="440" y="134" text-anchor="middle">Dataflow</text>
  <text class="edge-text" x="440" y="152">fenêtres, agrégats</text>

  <rect class="flow-box leaf" x="620" y="20" width="170" height="56"/>
  <text class="flow-label leaf-label" x="705" y="44" text-anchor="middle">BigQuery</text>
  <text class="edge-text" x="705" y="63">analyse, historique</text>

  <rect class="flow-box leaf" x="620" y="110" width="170" height="56"/>
  <text class="flow-label leaf-label" x="705" y="134" text-anchor="middle">Bigtable</text>
  <text class="edge-text" x="705" y="153">lecture par clé, ms</text>

  <rect class="flow-box" x="620" y="200" width="170" height="56"/>
  <text class="flow-label" x="705" y="224" text-anchor="middle">Lettres mortes</text>
  <text class="edge-text" x="705" y="242">table ou bucket d'erreurs</text>
</svg>
