<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 236" role="img" aria-label="Échange de jeton de la fédération d'identité : le job CI reçoit un JWT de son émetteur OIDC, l'échange auprès du Security Token Service contre un jeton fédéré, puis emprunte un compte de service pour obtenir un jeton d'accès aux API Google Cloud ; l'accès direct utilise le jeton fédéré">
  <!-- Liaisons -->
  <path class="flow-line" d="M95 66 V164"/>
  <path class="flow-line" d="M180 195 H274"/>
  <path class="flow-line" d="M470 195 H594"/>
  <path class="flow-line" d="M695 170 V72"/>
  <path class="flow-line" d="M375 170 V41 H594"/>

  <!-- Pastilles -->
  <rect class="edge-chip" x="45" y="106" width="100" height="18"/>
  <text class="edge-text" x="95" y="119">1 · JWT signé</text>
  <rect class="edge-chip" x="190" y="186" width="80" height="18"/>
  <text class="edge-text" x="230" y="199">2 · échange</text>
  <rect class="edge-chip" x="479" y="186" width="112" height="18"/>
  <text class="edge-text" x="535" y="199">3 · jeton fédéré</text>
  <rect class="edge-chip" x="636" y="112" width="118" height="18"/>
  <text class="edge-text" x="695" y="125">4 · jeton d'accès</text>
  <rect class="edge-chip" x="402" y="32" width="170" height="18"/>
  <text class="edge-text" x="487" y="45">accès direct, jeton fédéré</text>

  <!-- Flèches -->
  <polygon class="flow-arrow" points="91,164 99,164 95,170"/>
  <polygon class="flow-arrow" points="274,191 274,199 280,195"/>
  <polygon class="flow-arrow" points="594,191 594,199 600,195"/>
  <polygon class="flow-arrow" points="691,72 699,72 695,66"/>
  <polygon class="flow-arrow" points="594,37 594,45 600,41"/>

  <!-- Nœuds -->
  <rect class="flow-box" x="10" y="16" width="170" height="50"/>
  <text class="flow-label" x="95" y="37" text-anchor="middle">Émetteur OIDC</text>
  <text class="edge-text" x="95" y="55">GitHub, GitLab</text>

  <rect class="flow-box" x="10" y="170" width="170" height="50"/>
  <text class="flow-label" x="95" y="191" text-anchor="middle">Job CI</text>
  <text class="edge-text" x="95" y="209">sub, repository_id…</text>

  <rect class="flow-box q" x="280" y="170" width="190" height="50"/>
  <text class="flow-label q-label" x="375" y="191" text-anchor="middle">Security Token Service</text>
  <text class="edge-text" x="375" y="209">fournisseur, condition</text>

  <rect class="flow-box" x="600" y="170" width="190" height="50"/>
  <text class="flow-label" x="695" y="191" text-anchor="middle">IAM Credentials</text>
  <text class="edge-text" x="695" y="209">emprunt du compte</text>

  <rect class="flow-box leaf" x="600" y="16" width="190" height="50"/>
  <text class="flow-label leaf-label" x="695" y="37" text-anchor="middle">API Google Cloud</text>
  <text class="edge-text" x="695" y="55">Artifact Registry, Cloud Run</text>
</svg>
