<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" role="img" aria-label="Arbre de diagnostic d'un pipeline Dataflow, du symptôme à la cause probable">
  <!-- Niveau 1 : symptôme -->
  <rect class="flow-box q" x="300" y="22" width="200" height="36"/>
  <text class="flow-label q-label" x="400" y="45" text-anchor="middle">Symptôme ?</text>
  <path class="flow-line" d="M400 58 V95 M200 95 H655 M200 95 V156 M460 95 V276 M655 95 V156"/>
  <rect class="edge-chip" x="140" y="116" width="120" height="18"/>
  <text class="edge-text" x="200" y="129">retard qui croît</text>
  <rect class="edge-chip" x="398" y="116" width="124" height="18"/>
  <text class="edge-text" x="460" y="129">OOM, worker perdu</text>
  <rect class="edge-chip" x="605" y="116" width="100" height="18"/>
  <text class="edge-text" x="655" y="129">job en échec</text>
  <polygon class="flow-arrow" points="196,156 204,156 200,162"/>
  <polygon class="flow-arrow" points="651,156 659,156 655,162"/>

  <!-- Niveau 2 : retard qui croît -->
  <rect class="flow-box q" x="105" y="162" width="190" height="36"/>
  <text class="flow-label q-label" x="200" y="185" text-anchor="middle">CPU des workers ?</text>
  <path class="flow-line" d="M200 198 V225 M70 225 H330 M70 225 V276 M200 225 V276 M330 225 V276"/>
  <rect class="edge-chip" x="28" y="244" width="84" height="18"/>
  <text class="edge-text" x="70" y="257">saturé partout</text>
  <rect class="edge-chip" x="165" y="244" width="70" height="18"/>
  <text class="edge-text" x="200" y="257">inégal</text>
  <rect class="edge-chip" x="295" y="244" width="70" height="18"/>
  <text class="edge-text" x="330" y="257">faible</text>

  <!-- Niveau 2 : job en échec -->
  <rect class="flow-box q" x="565" y="162" width="180" height="36"/>
  <text class="flow-label q-label" x="655" y="185" text-anchor="middle">Message du job ?</text>
  <path class="flow-line" d="M655 198 V225 M590 225 H720 M590 225 V276 M720 225 V276"/>
  <rect class="edge-chip" x="540" y="244" width="100" height="18"/>
  <text class="edge-text" x="590" y="257">quota, IP, zone</text>
  <rect class="edge-chip" x="670" y="244" width="100" height="18"/>
  <text class="edge-text" x="720" y="257">accès, délai</text>

  <!-- Feuilles -->
  <g>
    <polygon class="flow-arrow" points="66,276 74,276 70,282"/>
    <polygon class="flow-arrow" points="196,276 204,276 200,282"/>
    <polygon class="flow-arrow" points="326,276 334,276 330,282"/>
    <polygon class="flow-arrow" points="456,276 464,276 460,282"/>
    <polygon class="flow-arrow" points="586,276 594,276 590,282"/>
    <polygon class="flow-arrow" points="716,276 724,276 720,282"/>
  </g>
  <rect class="flow-box leaf" x="8" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="70" y="307" text-anchor="middle">Workers, quota</text>
  <rect class="flow-box leaf" x="138" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="200" y="307" text-anchor="middle">Clé chaude</text>
  <rect class="flow-box leaf" x="268" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="330" y="307" text-anchor="middle">Sink, fusion</text>
  <rect class="flow-box leaf" x="398" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="460" y="307" text-anchor="middle">Threads, RAM</text>
  <rect class="flow-box leaf" x="528" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="590" y="307" text-anchor="middle">Quotas, région</text>
  <rect class="flow-box leaf" x="658" y="282" width="124" height="40"/>
  <text class="flow-label leaf-label" x="720" y="307" text-anchor="middle">IAM, réseau</text>
</svg>
