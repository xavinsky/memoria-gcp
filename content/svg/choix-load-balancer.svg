<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-label="Arbre de décision pour choisir un load balancer : protocole, puis clients externes ou internes, puis portée globale, interrégionale ou régionale">
  <!-- Niveau 1 : protocole -->
  <rect class="flow-box q" x="295" y="22" width="200" height="36"/>
  <text class="flow-label q-label" x="395" y="45" text-anchor="middle">Protocole ?</text>
  <path class="flow-line" d="M395 58 V95 M135 95 H655 M135 95 V156 M395 95 V156 M655 95 V156"/>
  <rect class="edge-chip" x="93" y="116" width="84" height="18"/>
  <text class="edge-text" x="135" y="129">HTTP, HTTPS</text>
  <rect class="edge-chip" x="340" y="116" width="110" height="18"/>
  <text class="edge-text" x="395" y="129">TCP, option TLS</text>
  <rect class="edge-chip" x="597" y="116" width="116" height="18"/>
  <text class="edge-text" x="655" y="129">UDP, IP du client</text>
  <polygon class="flow-arrow" points="131,156 139,156 135,162"/>
  <polygon class="flow-arrow" points="391,156 399,156 395,162"/>
  <polygon class="flow-arrow" points="651,156 659,156 655,162"/>

  <!-- Niveau 2 : familles -->
  <rect class="flow-box" x="45" y="162" width="180" height="44"/>
  <text class="flow-label" x="135" y="181" text-anchor="middle">Application LB</text>
  <text class="edge-text" x="135" y="197">couche 7, proxy</text>
  <rect class="flow-box" x="305" y="162" width="180" height="44"/>
  <text class="flow-label" x="395" y="181" text-anchor="middle">Network LB proxy</text>
  <text class="edge-text" x="395" y="197">couche 4, proxy</text>
  <rect class="flow-box" x="565" y="162" width="180" height="44"/>
  <text class="flow-label" x="655" y="181" text-anchor="middle">Network LB passthrough</text>
  <text class="edge-text" x="655" y="197">couche 4, sans proxy</text>

  <!-- Niveau 3 : clients -->
  <path class="flow-line" d="M135 206 V225 M70 225 H200 M70 225 V276 M200 225 V276"/>
  <path class="flow-line" d="M395 206 V225 M330 225 H460 M330 225 V276 M460 225 V276"/>
  <path class="flow-line" d="M655 206 V225 M590 225 H720 M590 225 V276 M720 225 V276"/>
  <rect class="edge-chip" x="42" y="244" width="56" height="18"/>
  <text class="edge-text" x="70" y="257">internet</text>
  <rect class="edge-chip" x="160" y="244" width="80" height="18"/>
  <text class="edge-text" x="200" y="257">VPC, hybride</text>
  <rect class="edge-chip" x="302" y="244" width="56" height="18"/>
  <text class="edge-text" x="330" y="257">internet</text>
  <rect class="edge-chip" x="420" y="244" width="80" height="18"/>
  <text class="edge-text" x="460" y="257">VPC, hybride</text>
  <rect class="edge-chip" x="562" y="244" width="56" height="18"/>
  <text class="edge-text" x="590" y="257">internet</text>
  <rect class="edge-chip" x="680" y="244" width="80" height="18"/>
  <text class="edge-text" x="720" y="257">VPC, hybride</text>

  <!-- Feuilles : portée -->
  <g>
    <polygon class="flow-arrow" points="66,276 74,276 70,282"/>
    <polygon class="flow-arrow" points="196,276 204,276 200,282"/>
    <polygon class="flow-arrow" points="326,276 334,276 330,282"/>
    <polygon class="flow-arrow" points="456,276 464,276 460,282"/>
    <polygon class="flow-arrow" points="586,276 594,276 590,282"/>
    <polygon class="flow-arrow" points="716,276 724,276 720,282"/>
  </g>
  <rect class="flow-box leaf" x="8" y="282" width="124" height="62"/>
  <text class="flow-label leaf-label" x="70" y="302" text-anchor="middle">Externe</text>
  <text class="edge-text" x="70" y="320">global</text>
  <text class="edge-text" x="70" y="335">régional</text>
  <rect class="flow-box leaf" x="138" y="282" width="124" height="62"/>
  <text class="flow-label leaf-label" x="200" y="302" text-anchor="middle">Interne</text>
  <text class="edge-text" x="200" y="320">interrégional</text>
  <text class="edge-text" x="200" y="335">régional</text>
  <rect class="flow-box leaf" x="268" y="282" width="124" height="62"/>
  <text class="flow-label leaf-label" x="330" y="302" text-anchor="middle">Externe</text>
  <text class="edge-text" x="330" y="320">global</text>
  <text class="edge-text" x="330" y="335">régional</text>
  <rect class="flow-box leaf" x="398" y="282" width="124" height="62"/>
  <text class="flow-label leaf-label" x="460" y="302" text-anchor="middle">Interne</text>
  <text class="edge-text" x="460" y="320">interrégional</text>
  <text class="edge-text" x="460" y="335">régional</text>
  <rect class="flow-box leaf" x="528" y="282" width="124" height="62"/>
  <text class="flow-label leaf-label" x="590" y="302" text-anchor="middle">Externe</text>
  <text class="edge-text" x="590" y="320">régional</text>
  <text class="edge-text" x="590" y="335">global (preview)</text>
  <rect class="flow-box leaf" x="658" y="282" width="124" height="62"/>
  <text class="flow-label leaf-label" x="720" y="302" text-anchor="middle">Interne</text>
  <text class="edge-text" x="720" y="320">régional</text>
  <text class="edge-text" x="720" y="335">+ accès global</text>
</svg>
