<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria GCP — aide-mémoire Google Cloud</title>
<script>
// Zoom et thème appliqués avant le premier rendu, pour éviter un saut de mise en page ou un flash
// de la mauvaise teinte (mêmes clés localStorage que www/engine.js).
(function(){
  try {
    var z = parseFloat(localStorage.getItem("memogcp-zoom")) || 1;
    document.documentElement.style.zoom = z * 1.2;
    var t = localStorage.getItem("memogcp-theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topnav">
  <div class="brand"><h1>Memoria<sup>GCP</sup></h1></div>
  <nav class="top-tabs" id="top-tabs"></nav>
  <div class="topnav-search">
    <input type="search" id="search-input" placeholder="Rechercher… ( / )" autocomplete="off" aria-controls="search-results">
    <div id="search-results" hidden></div>
  </div>
  <button type="button" id="theme-toggle" aria-label="Passer en mode sombre" aria-pressed="false">
    <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M5.64 5.64l1.42 1.42M16.94 16.94l1.42 1.42M3 12h2M19 12h2M5.64 18.36l1.42-1.42M16.94 7.06l1.42-1.42"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M20.6 15.3A9 9 0 0 1 8.7 3.4 9 9 0 1 0 20.6 15.3Z"/></svg>
  </button>
</header>

<div id="body-row">
  <aside id="sidebar">
    <div id="sidebar-scroll"></div>
    <div class="sidebar-footer">
      <div class="zoom-controls">
        <button id="zoom-out" type="button" aria-label="Réduire le zoom">−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" type="button" aria-label="Augmenter le zoom">+</button>
        <button id="scrollbar-toggle" type="button" aria-label="Afficher ou masquer la barre de défilement du menu"></button>
      </div>
      <div class="last-updated" id="last-updated"></div>
    </div>
  </aside>
  <main id="main-root"></main>
</div>

<script src="data/content.js"></script>
<script>const GENERATORS = [];</script>
<script src="engine.js"></script>
</body>
</html>
